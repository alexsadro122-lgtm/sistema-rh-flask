<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

    <title>Login</title>

    <!-- CSS do login -->
    <link rel="stylesheet"
    href="{{ url_for('static', filename='css/login.css') }}">
</head>

<body>

    <div class="login-container">

        <div class="login-card">

            <h1>Login</h1>

            <!-- Mensagens -->
            {% with messages = get_flashed_messages() %}
                {% if messages %}

                    <div class="popup">
                        {{ messages[0] }}
                    </div>

                {% endif %}
            {% endwith %}

            <!-- Formulário -->
            <form action="/autenticar" method="post">

                <input
                    type="email"
                    name="email"
                    placeholder="Email"
                    required
                >

                <input
                    type="password"
                    name="senha"
                    placeholder="Senha"
                    required
                >

                <button type="submit">
                    Entrar
                </button>

            </form>

        </div>

    </div>

</body>
</html>
